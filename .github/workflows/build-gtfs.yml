name: Build Italo GTFS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Italo NeTEx
        run: |
          mkdir -p data output

          SOURCE_URL="https://www.cciss.it/nap/mmtis/public/api/v1/download/blob/Asset/1814124/checkedResource"

          echo "Downloading Italo NeTEx from CCISS..."

          curl --fail --location --show-error \
            --retry 3 \
            --retry-delay 10 \
            "$SOURCE_URL" \
            -o data/IT-IT-ITALO_L1.xml.gz

          echo "Checking downloaded file..."

          gzip -t data/IT-IT-ITALO_L1.xml.gz

          echo "CCISS source downloaded successfully."

          gunzip -f data/IT-IT-ITALO_L1.xml.gz

      - name: Clone netex2gtfs
        run: |
          git clone https://github.com/LodiAleardo/netex2gtfs.git converter
          git -C converter checkout 4441defc0c50004aa5ed214a5895dff46393e559

      - name: Install converter dependencies
        working-directory: converter
        run: |
          python -m pip install -r requirements.txt

      - name: Convert NeTEx to GTFS
        working-directory: converter
        run: |
          python main.py \
            --input ../data/IT-IT-ITALO_L1.xml \
            --output ../output/ITALO_gtfs.zip \
            --verbose

      - name: Validate generated GTFS
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import csv
          import io

          gtfs = Path("output/ITALO_gtfs.zip")

          if not gtfs.is_file() or gtfs.stat().st_size == 0:
              raise SystemExit("GTFS ZIP is missing or empty")

          required = {
              "agency.txt": "agency_id",
              "stops.txt": "stop_id",
              "routes.txt": "route_id",
              "trips.txt": "trip_id",
              "stop_times.txt": "trip_id",
              "calendar_dates.txt": "service_id",
              "feed_info.txt": "feed_info_version",
          }

          with ZipFile(gtfs) as z:
              names = set(z.namelist())

              for filename, required_column in required.items():
                  if filename not in names:
                      raise SystemExit(f"Missing required file: {filename}")

                  with z.open(filename) as f:
                      text = io.TextIOWrapper(f, encoding="utf-8-sig", newline="")
                      rows = list(csv.DictReader(text))

                  if not rows:
                      raise SystemExit(f"{filename} contains no data rows")

                  if required_column not in rows[0]:
                      raise SystemExit(
                          f"{filename} is missing required column: {required_column}"
                      )

                  print(f"{filename}: {len(rows)} rows")

          print("GTFS sanity checks passed.")
          PY

      - name: Upload GitHub Pages artifact

        uses: actions/upload-pages-artifact@v4

        with:

          path: output
            
      - name: Upload GTFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITALO_gtfs
          path: output/ITALO_gtfs.zip
          
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4