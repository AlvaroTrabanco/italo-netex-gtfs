name: Build Italo GTFS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Italo NeTEx
        run: |
          mkdir -p data output

          SOURCE_URL="https://www.cciss.it/nap/mmtis/public/api/v1/download/blob/Asset/1814124/checkedResource"

          echo "Downloading Italo NeTEx from CCISS..."

          curl --fail --location --show-error \
            --retry 3 \
            --retry-delay 10 \
            "$SOURCE_URL" \
            -o data/IT-IT-ITALO_L1.xml.gz

          echo "Checking downloaded file..."

          gzip -t data/IT-IT-ITALO_L1.xml.gz

          echo "CCISS source downloaded successfully."

          gunzip -f data/IT-IT-ITALO_L1.xml.gz

      - name: Clone netex2gtfs
        run: |
          git clone https://github.com/LodiAleardo/netex2gtfs.git converter
          git -C converter checkout 4441defc0c50004aa5ed214a5895dff46393e559

      - name: Install converter dependencies
        working-directory: converter
        run: |
          python -m pip install -r requirements.txt

      - name: Convert NeTEx to GTFS
        working-directory: converter
        run: |
          python main.py \
            --input ../data/IT-IT-ITALO_L1.xml \
            --output ../output/ITALO_gtfs.zip \
            --verbose

      - name: Remove combinations and merge routes
        run: |
          python scripts/remove_combination_routes.py \
            output/ITALO_gtfs.zip \
            output/ITALO_gtfs_filtered.zip

          mv output/ITALO_gtfs_filtered.zip output/ITALO_gtfs.zip

          echo "Final GTFS route count:"
          unzip -p output/ITALO_gtfs.zip routes.txt | tail -n +2 | wc -l

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download MobilityData GTFS Validator
        run: |
          curl --fail --location --show-error \
            "https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar" \
            -o gtfs-validator.jar

          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  gtfs-validator.jar" \
            | sha256sum -c -

      - name: Generate calendar audit
        run: |
          rm -rf calendar-audit
          python scripts/calendar_audit.py \
            output/ITALO_gtfs.zip \
            calendar-audit

      - name: Upload calendar audit
        uses: actions/upload-artifact@v4
        with:
          name: italo-calendar-audit
          path: calendar-audit

      - name: Validate generated GTFS
        run: |
          rm -rf validator-report

          java -jar gtfs-validator.jar \
            -i output/ITALO_gtfs.zip \
            -o validator-report

          echo "Validation report:"
          cat validator-report/report.json

      - name: Upload validator report
        uses: actions/upload-artifact@v4
        with:
          name: mobilitydata-validator-report
          path: validator-report

      - name: Prepare GitHub Pages files
        run: |
          rm -rf public
          mkdir -p public

          cp output/ITALO_gtfs.zip public/ITALO_gtfs.zip

          mkdir -p public/validator-report
          cp -R validator-report/. public/validator-report/

          if [ -f public/validator-report/report.html ]; then
            cp public/validator-report/report.html \
              public/validator-report/index.html
          fi

          mkdir -p public/calendar-audit
          cp -R calendar-audit/. public/calendar-audit/

      - name: Check GTFS ZIP structure
        run: |
          echo "Contents of GTFS ZIP:"
          unzip -Z1 output/ITALO_gtfs.zip

          if unzip -Z1 output/ITALO_gtfs.zip | grep -q '/'; then
            echo "ERROR: GTFS ZIP contains directories."
            exit 1
          fi

          required_files="agency.txt stops.txt routes.txt trips.txt stop_times.txt calendar_dates.txt"

          for file in $required_files; do
            if ! unzip -Z1 output/ITALO_gtfs.zip | grep -qx "$file"; then
              echo "ERROR: Missing $file from GTFS ZIP."
              exit 1
            fi
          done

          echo "GTFS ZIP structure is valid."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Upload GTFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITALO_gtfs
          path: output/ITALO_gtfs.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4