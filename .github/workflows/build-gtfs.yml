name: Build Italo GTFS

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Italo NeTEx
        run: |
          mkdir -p data output

          PAGE_URL="https://www.cciss.it/nap/mmtis/public/en/catalog/Dataset/1813935"

          DOWNLOAD_URL=$(curl -fsSL "$PAGE_URL" \
            | grep -oE 'https://www\.cciss\.it/nap/mmtis/public/api/v1/download/blob/Asset/[0-9]+/resource' \
            | head -1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find the current Italo NeTEx download URL"
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"

          curl -fL "$DOWNLOAD_URL" \
            -o data/IT-IT-ITALO_L1.xml.gz

          gunzip -f data/IT-IT-ITALO_L1.xml.gz

      - name: Clone netex2gtfs
        run: |
          git clone https://github.com/LodiAleardo/netex2gtfs.git converter

      - name: Install converter dependencies
        working-directory: converter
        run: |
          python -m pip install -r requirements.txt

      - name: Convert NeTEx to GTFS
        working-directory: converter
        run: |
          python main.py \
            --input ../data/IT-IT-ITALO_L1.xml \
            --output ../output/ITALO_gtfs.zip \
            --verbose

      - name: Upload GitHub Pages artifact

        uses: actions/upload-pages-artifact@v4

        with:

          path: output
            
      - name: Upload GTFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITALO_gtfs
          path: output/ITALO_gtfs.zip
          
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4