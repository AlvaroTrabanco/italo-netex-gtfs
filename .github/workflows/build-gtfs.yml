name: Build Italo GTFS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Italo NeTEx
        run: |
          mkdir -p data output

          SOURCE_URL="https://www.cciss.it/nap/mmtis/public/api/v1/download/blob/Asset/1814124/checkedResource"

          echo "Downloading Italo NeTEx from CCISS..."

          curl --fail --location --show-error \
            --retry 3 \
            --retry-delay 10 \
            "$SOURCE_URL" \
            -o data/IT-IT-ITALO_L1.xml.gz

          echo "Checking downloaded file..."

          gzip -t data/IT-IT-ITALO_L1.xml.gz

          echo "CCISS source downloaded successfully."

          gunzip -f data/IT-IT-ITALO_L1.xml.gz

      - name: Clone netex2gtfs
        run: |
          git clone https://github.com/LodiAleardo/netex2gtfs.git converter
          git -C converter checkout 4441defc0c50004aa5ed214a5895dff46393e559

      - name: Install converter dependencies
        working-directory: converter
        run: |
          python -m pip install -r requirements.txt

      - name: Convert NeTEx to GTFS
        working-directory: converter
        run: |
          python main.py \
            --input ../data/IT-IT-ITALO_L1.xml \
            --output ../output/ITALO_gtfs.zip \
            --verbose

      - name: Validate generated GTFS
        run: |
          unzip -t output/ITALO_gtfs.zip

          test -s output/ITALO_gtfs.zip

          unzip -p output/ITALO_gtfs.zip agency.txt > /tmp/agency.txt
          unzip -p output/ITALO_gtfs.zip stops.txt > /tmp/stops.txt
          unzip -p output/ITALO_gtfs.zip routes.txt > /tmp/routes.txt
          unzip -p output/ITALO_gtfs.zip trips.txt > /tmp/trips.txt
          unzip -p output/ITALO_gtfs.zip stop_times.txt > /tmp/stop_times.txt
          unzip -p output/ITALO_gtfs.zip calendar_dates.txt > /tmp/calendar_dates.txt

          grep -q '^agency_id' /tmp/agency.txt
          grep -q '^stop_id' /tmp/stops.txt
          grep -q '^route_id' /tmp/routes.txt
          grep -q '^trip_id' /tmp/trips.txt
          grep -q '^trip_id' /tmp/stop_times.txt
          grep -q '^service_id' /tmp/calendar_dates.txt

          test "$(tail -n +2 /tmp/agency.txt | wc -l)" -gt 0
          test "$(tail -n +2 /tmp/stops.txt | wc -l)" -gt 0
          test "$(tail -n +2 /tmp/routes.txt | wc -l)" -gt 0
          test "$(tail -n +2 /tmp/trips.txt | wc -l)" -gt 0
          test "$(tail -n +2 /tmp/stop_times.txt | wc -l)" -gt 0
          test "$(tail -n +2 /tmp/calendar_dates.txt | wc -l)" -gt 0

          echo "GTFS sanity checks passed."

      - name: Upload GitHub Pages artifact

        uses: actions/upload-pages-artifact@v4

        with:

          path: output
            
      - name: Upload GTFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITALO_gtfs
          path: output/ITALO_gtfs.zip
          
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4